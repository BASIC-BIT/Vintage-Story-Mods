name: GUI Capture Report

# Evidence comparison only. Rendering, baseline approval, and gameplay QA are separate.
on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: Immutable workflow run containing the reviewed baseline
        type: string
        required: true
      baseline_artifact:
        description: Baseline artifact name (captures.json must be at its root)
        type: string
        default: gui-captures
      baseline_source_hash:
        description: Reviewed baseline sourceTreeHash (SHA-256)
        type: string
        required: true
      baseline_reviewed:
        description: I have explicitly reviewed and selected this baseline
        type: boolean
        default: false
      current_run_id:
        description: Immutable workflow run containing current captures
        type: string
        required: true
      current_artifact:
        description: Current artifact name (captures.json must be at its root)
        type: string
        default: gui-captures
      current_source_ref:
        description: Immutable current source commit SHA (evidence-only commits may differ)
        type: string
        required: true
      pr_number:
        description: PR number for optional sticky report
        type: string
        default: ''
      publish_comment:
        description: Publish or update the PR sticky report under [AGENT]
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gui-capture-report-${{ inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Run trusted report code, never a script downloaded in capture artifacts.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate explicit evidence selection
        env:
          BASELINE_RUN: ${{ inputs.baseline_run_id }}
          CURRENT_RUN: ${{ inputs.current_run_id }}
          BASELINE_HASH: ${{ inputs.baseline_source_hash }}
          REVIEWED: ${{ inputs.baseline_reviewed }}
          SOURCE_REF: ${{ inputs.current_source_ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PUBLISH: ${{ inputs.publish_comment }}
        run: |
          [[ "$REVIEWED" == true ]]
          [[ "$BASELINE_RUN" =~ ^[1-9][0-9]*$ && "$CURRENT_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$BASELINE_HASH" =~ ^[0-9a-fA-F]{64}$ && "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ -z "$PR_NUMBER" || "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$PUBLISH" != true || -n "$PR_NUMBER" ]]
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check comparison logic
        run: python -B -m unittest discover -s scripts -p test_gui_capture_report.py
      - name: Read immutable current source tree
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.current_source_ref }}
          path: source
          persist-credentials: false
      - name: Calculate expected current source identity
        id: identity
        shell: pwsh
        run: |
          $identity = & ./scripts/gui-source-identity.ps1 -Repo ./source
          if ($identity -notmatch '^[0-9a-f]{64}$') { throw 'Invalid source identity.' }
          "source_hash=$identity" >> $env:GITHUB_OUTPUT
      - name: Download explicit reviewed baseline
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.baseline_run_id }}
          name: ${{ inputs.baseline_artifact }}
          path: inputs/baseline
      - name: Download current captures
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.current_run_id }}
          name: ${{ inputs.current_artifact }}
          path: inputs/current
      - name: Compare evidence without changing inputs
        id: comparison
        continue-on-error: true
        env:
          BASELINE_HASH: ${{ inputs.baseline_source_hash }}
          CURRENT_HASH: ${{ steps.identity.outputs.source_hash }}
        run: |
          python -B scripts/gui-capture-report.py \
            --baseline inputs/baseline --current inputs/current --output capture-report \
            --baseline-source-hash "$BASELINE_HASH" --current-source-hash "$CURRENT_HASH"
      - name: Upload immutable before, after, diff, and provenance report
        id: artifact
        if: always() && steps.comparison.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: gui-capture-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: capture-report/
          if-no-files-found: error
          retention-days: 90
      - name: Prepare report with immutable evidence links
        if: steps.artifact.outcome == 'success'
        env:
          REPORT_URL: ${{ steps.artifact.outputs.artifact-url }}
          BASELINE_RUN: ${{ inputs.baseline_run_id }}
          CURRENT_RUN: ${{ inputs.current_run_id }}
          SOURCE_REF: ${{ inputs.current_source_ref }}
        run: |
          python - <<'PY'
          import html, json, os
          from pathlib import Path
          report = json.loads(Path('capture-report/report.json').read_text())
          repo = os.environ['GITHUB_REPOSITORY']
          server = os.environ['GITHUB_SERVER_URL']
          body = ['<!-- gui-capture-report -->', '[AGENT]', '', 'GUI capture evidence: **' + ('compatible' if report['evidenceValid'] else 'missing or stale') + '**.', '',
                  'Pixel changes require review. Layout-only captures do not certify native character or animation appearance. This report does not approve a baseline or complete gameplay QA.', '',
                  '[Download before/after images, pixel diffs, HTML report, and manifests](' + os.environ['REPORT_URL'] + ').', '',
                  '[Reviewed baseline run](' + server + '/' + repo + '/actions/runs/' + os.environ['BASELINE_RUN'] + '), [current capture run](' + server + '/' + repo + '/actions/runs/' + os.environ['CURRENT_RUN'] + ').', '',
                  'Baseline source: `' + report['baselineSourceTreeHash'] + '`. Current source: `' + report['currentSourceTreeHash'] + '`.',
                  'Current source commit: `' + os.environ['SOURCE_REF'] + '`. Source-tree identity permits later evidence-only commits.', '',
                  '| Scenario | Status | Changed pixels |', '| --- | --- | ---: |']
          for row in report['captures'][:200]:
              scenario = html.escape(row['scenario']).replace('|', '&#124;').replace('\n', ' ').replace('\r', ' ')
              body.append('| ' + scenario + ' | ' + row['status'] + ' | ' + str(row.get('changedPixels', '')) + ' |')
          if len(report['captures']) > 200:
              body += ['', 'Additional scenarios are included in the downloadable report.']
          text = '\n'.join(body) + '\n'
          Path('capture-report-comment.md').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text)
          PY
      - name: Read PR head before optional publication
        id: pr
        if: inputs.publish_comment && steps.artifact.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR_NUMBER)});
            if (pr.state !== 'open') throw new Error('PR is no longer open.');
            core.setOutput('head', pr.head.sha);
      - name: Read current PR source tree
        if: inputs.publish_comment && steps.artifact.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          path: pr-source
          persist-credentials: false
      - name: Require capture source identity to match current PR code
        if: inputs.publish_comment && steps.artifact.outcome == 'success'
        shell: pwsh
        env:
          EXPECTED_HASH: ${{ steps.identity.outputs.source_hash }}
        run: |
          $identity = & ./scripts/gui-source-identity.ps1 -Repo ./pr-source
          if ($identity -ne $env:EXPECTED_HASH) { throw 'PR source changed. Collect current captures before publishing.' }
      - name: Upsert explicitly selected PR sticky report
        if: inputs.publish_comment && steps.artifact.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.head }}
        with:
          script: |
            const fs = require('node:fs');
            const issue_number = Number(process.env.PR_NUMBER);
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: issue_number});
            if (pr.state !== 'open' || pr.head.sha !== process.env.EXPECTED_HEAD) throw new Error('PR head changed during report generation.');
            const marker = '<!-- gui-capture-report -->';
            const body = fs.readFileSync('capture-report-comment.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number, per_page: 100});
            const existing = comments.filter(comment => comment.user.login === 'github-actions[bot]' && comment.body.includes(marker)).at(-1);
            if (existing) await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number, body});
      - name: Fail on missing or stale evidence
        if: always() && steps.comparison.outcome == 'failure'
        run: exit 1
